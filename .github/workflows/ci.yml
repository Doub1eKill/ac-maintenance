# Checks every push and pull request without a database: types, lint and the
# vitest unit tests. The Playwright sweep (qa/) is not run here — it writes to
# the one Aiven database production uses, so it stays a deliberate local step.
#
# Deploys are gated separately: Vercel runs `npm run build`, which runs
# `vitest run` before `next build`, so a failing unit test stops the deploy.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The generated client is gitignored; tsc needs its types. No
      # DATABASE_URL is required to generate.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
